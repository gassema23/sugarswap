name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/gassema23/sugarswap-frontend
  BACKEND_IMAGE:  ghcr.io/gassema23/sugarswap-backend

jobs:
  build-and-push:
    name: Build Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_WS_URL=wss://vynia.app/ws
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: Prod
    env:
      DEPLOY_DIR: /home/${{ secrets.VPS_USER }}/sugarswap

    steps:
      - name: Checkout (for docker-compose + Caddyfile)
        uses: actions/checkout@v4

      - name: Check deploy secrets
        run: |
          ok=1
          [ -n "$VPS_HOST" ]    || { echo "::error::Secret VPS_HOST vide";    ok=0; }
          [ -n "$VPS_USER" ]    || { echo "::error::Secret VPS_USER vide";    ok=0; }
          [ -n "$VPS_SSH_KEY" ] || { echo "::error::Secret VPS_SSH_KEY vide"; ok=0; }
          [ "$ok" = 1 ] || exit 1
        env:
          VPS_HOST:    ${{ secrets.VPS_HOST }}
          VPS_USER:    ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Write SSH key for deploy actions
        run: |
          printf '%s\n' "$VPS_SSH_KEY" > "$GITHUB_WORKSPACE/.deploy_ssh_key"
          chmod 600 "$GITHUB_WORKSPACE/.deploy_ssh_key"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Verify SSH private key (fingerprint only)
        run: ssh-keygen -l -f "$GITHUB_WORKSPACE/.deploy_ssh_key"

      - name: Copy config files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          KEY="$GITHUB_WORKSPACE/.deploy_ssh_key"
          ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" "mkdir -p -- \"$DEPLOY_DIR\""
          scp -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            docker-compose.yml Caddyfile \
            "$VPS_USER@$VPS_HOST:$DEPLOY_DIR/"

      - name: Write .env on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          KEY="$GITHUB_WORKSPACE/.deploy_ssh_key"
          # Write the .env file directly on the VPS via SSH — secrets never touch the repo
          ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" "cat > \"$DEPLOY_DIR/.env\"" <<EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET=${{ secrets.FACEBOOK_APP_SECRET }}
          EOF

      - name: Pull images & restart
        env:
          VPS_HOST:  ${{ secrets.VPS_HOST }}
          VPS_USER:  ${{ secrets.VPS_USER }}
          GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR:  ${{ github.actor }}
        run: |
          set -euo pipefail
          KEY="$GITHUB_WORKSPACE/.deploy_ssh_key"
          ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" \
            "export PATH=\"/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin\"; \
             set -euo pipefail; \
             command -v docker >/dev/null || { echo '::error::docker introuvable'; exit 127; }; \
             cd \"$DEPLOY_DIR\"; \
             echo \"$GH_TOKEN\" | sudo -n docker login ghcr.io -u \"$GH_ACTOR\" --password-stdin; \
             sudo -n docker compose pull; \
             sudo -n docker compose up -d --remove-orphans; \
             sudo -n docker image prune -f"

      - name: Remove deploy SSH key file
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.deploy_ssh_key"

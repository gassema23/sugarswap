name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/gassema23/sugarswap-frontend
  BACKEND_IMAGE: ghcr.io/gassema23/sugarswap-backend

jobs:
  build-and-push:
    name: Build Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./sugar-swap
          file: ./sugar-swap/Dockerfile.frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_WS_URL=wss://vynia.app/ws
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./sugar-swap
          file: ./sugar-swap/Dockerfile.backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    # Sans ça, les secrets de l’environnement « Prod » ne sont pas disponibles (restent vides).
    environment: Prod
    env:
      # Doit correspondre à VPS_USER (utilisateur qui a la clé dans ~/.ssh/authorized_keys).
      DEPLOY_DIR: /home/${{ secrets.VPS_USER }}/sugarswap

    steps:
      - name: Checkout (for docker-compose + Caddyfile)
        uses: actions/checkout@v4

      - name: Check deploy secrets
        run: |
          ok=1
          [ -n "$VPS_HOST" ] || { echo "::error::Secret VPS_HOST vide — vérifie l’environnement « Prod » ou les secrets du dépôt"; ok=0; }
          [ -n "$VPS_USER" ] || { echo "::error::Secret VPS_USER vide"; ok=0; }
          [ -n "$VPS_SSH_KEY" ] || { echo "::error::Secret VPS_SSH_KEY vide — nom exact VPS_SSH_KEY dans l’environnement Prod"; ok=0; }
          [ "$ok" = 1 ] || exit 1
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      # Composite actions (v1) lisent la clé sur le runner → 600 OK. v0.1.x Docker = autre UID → 644.
      - name: Write SSH key for deploy actions
        run: |
          printf '%s\n' "$VPS_SSH_KEY" > "$GITHUB_WORKSPACE/.deploy_ssh_key"
          chmod 600 "$GITHUB_WORKSPACE/.deploy_ssh_key"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Verify SSH private key (fingerprint only)
        run: ssh-keygen -l -f "$GITHUB_WORKSPACE/.deploy_ssh_key"

      - name: Copy config files to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: ${{ github.workspace }}/.deploy_ssh_key
          source: "sugar-swap/docker-compose.yml,sugar-swap/Caddyfile"
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 1

      - name: Pull images & restart
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: ${{ github.workspace }}/.deploy_ssh_key
          script: |
            cd ${{ env.DEPLOY_DIR }}
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: Remove deploy SSH key file
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.deploy_ssh_key"

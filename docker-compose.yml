services:
  frontend:
    image: ghcr.io/gassema23/sugarswap-frontend:latest
    restart: unless-stopped
    networks:
      - app

  backend:
    image: ghcr.io/gassema23/sugarswap-backend:latest
    restart: unless-stopped
    volumes:
      # Modèle ONNX monté depuis le VPS — mis à jour sans rebuild d'image.
      # Sur le VPS : mkdir -p ~/ai-models && cp ppo_sugar_swap.onnx ~/ai-models/
      - ${AI_MODEL_DIR:-/tmp/ai-models}:/app/dist/ai/model:ro
    environment:
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: https://vynia.app/api/auth/google/callback
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      FACEBOOK_CALLBACK_URL: https://vynia.app/api/auth/facebook/callback
      FRONTEND_URL: https://vynia.app
    networks:
      - app

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app
    depends_on:
      - frontend
      - backend

volumes:
  caddy_data:
  caddy_config:

networks:
  app:
    driver: bridge
